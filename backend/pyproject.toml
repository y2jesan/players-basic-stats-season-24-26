[project]
name = "python-react-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastexcel>=0.20.2",
    "matplotlib>=3.11.1",
    "mplsoccer>=1.8.0",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
